name: TcBuild

# runs-on is a self-hosted runner and most of these repos are public. Therefore: `push` only, NEVER
# `pull_request` / `pull_request_target` -- a PR from any fork would otherwise execute on the runner
# (BROTLib#31; an earlier push+PR auto-trigger did exactly that and was reverted, see BROTLib
# specs/design/twincat-ci-runner-setup.md). A push can only come from someone with write access.
# Tags are ignored (the release flow tags after a build), and a newer push to the same branch
# cancels a queued/running build so the single runner does not pile up.
# Every repo of the org builds on every push, so the check name `build` exists everywhere. release.yml
# dispatches this workflow for the version bump (a push made with GITHUB_TOKEN starts no workflow).
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

concurrency:
  group: tcbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, twincat, windows]
    permissions:
      contents: read
      statuses: write   # the commit status below
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build BROTLib.sln
        shell: powershell
        run: |
          # TcBuild exit codes: 0 = built, 1 = built with compile warnings (still a success),
          # 2 = compile errors, 3 = COM busy (retry), 4/5 = other failure
          for ($i = 1; $i -le 4; $i++) {
            & "C:\Program Files\Industrial Brains B.V\TcBuild\TcBuild.exe" build BROTLib.sln
            if ($LASTEXITCODE -ne 3) { break }
            Start-Sleep -Seconds 30
          }
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          exit 0

      # A workflow_dispatch run (release.yml dispatches one for the version bump) is not linked to the
      # release PR, so its `build` check run does not satisfy the required `build` check on main and the PR
      # stays blocked (IAG #6). A commit status is tied to the SHA only: report this job's result as one.
      - name: Report the result as commit status `build`
        if: always() && github.event_name == 'workflow_dispatch'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -f state="$env:STATE" -f context=build -f description="TcBuild (dispatched run)" -f target_url="$env:RUN_URL"
          if ($LASTEXITCODE -ne 0) { throw "posting the commit status failed with exit code $LASTEXITCODE" }
