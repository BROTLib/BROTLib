name: TcBuild

# runs-on is a self-hosted runner on a public repo: keep this trigger workflow_dispatch only, never
# push/pull_request -- a PR from any fork would otherwise execute on it (BROTLib#31; a prior attempt
# at auto-triggering did exactly this and was reverted, see BROTLib specs/design/twincat-ci-runner-setup.md)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, twincat, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Build BROTLib.sln
        shell: powershell
        run: |
          # TcBuild exit codes: 0 = built, 1 = built with compile warnings (still a success),
          # 2 = compile errors, 3 = COM busy (retry), 4/5 = other failure
          for ($i = 1; $i -le 4; $i++) {
            & "C:\Program Files\Industrial Brains B.V\TcBuild\TcBuild.exe" build BROTLib.sln
            if ($LASTEXITCODE -ne 3) { break }
            Start-Sleep -Seconds 30
          }
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          exit 0