name: Cut release

# Bumps the version on develop, then opens a PR develop -> main. Merging that PR (main requires a
# PR, see the require-pr-main ruleset) triggers tag-release.yml, which tags the merge commit.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 0.3.2 (Major.Minor.Patch)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write   # the bump commit reports `build` without a rebuild, see `Report CI on the bump commit`

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be Major.Minor.Patch (e.g. 0.3.2)"
            exit 1
          fi

      - name: Checkout develop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          fetch-depth: 0

      - name: Remember the develop head before the bump
        run: echo "PRE_BUMP=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Bump ProjectVersion and GVL_Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          PLCPROJ="BROTLib/BROTLib/BROTLib.plcproj"
          GVL="BROTLib/BROTLib/GVLs/Global_Version.TcGVL"

          sed -i "s|<ProjectVersion>.*</ProjectVersion>|<ProjectVersion>${VERSION}</ProjectVersion>|" "$PLCPROJ"

          sed -i \
            -e "s|iMajor := [0-9]*|iMajor := ${MAJOR}|" \
            -e "s|iMinor := [0-9]*|iMinor := ${MINOR}|" \
            -e "s|iBuild := [0-9]*|iBuild := ${PATCH}|" \
            -e "s|sVersion := '[0-9.]*'|sVersion := '${VERSION}'|" \
            "$GVL"

      - name: Commit and push to develop
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BROTLib/BROTLib/BROTLib.plcproj BROTLib/BROTLib/GVLs/Global_Version.TcGVL
          # develop may already carry this version (bumped by hand): nothing to commit is not an error
          if git diff --cached --quiet; then
            echo "Version ${VERSION} is already on develop, no bump commit"
          else
            git commit -m "Bump version to ${VERSION}"
            git push origin develop
          fi

      - name: Report CI on the bump commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROOF: tests-passed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A push made with GITHUB_TOKEN starts no workflow, so without this the release PR head has no
          # checks. The bump changes only the version files: when the develop head before it was built (a successful
          # tcbuild run of the same tree with a `build-passed` status, the proof of tools/Find-TestedTree.ps1), the
          # bump commit needs no rebuild. Report `build` and the proof on it as commit statuses (the required check
          # `build` of the main ruleset does not care where it comes from). Otherwise, or if anything but the version
          # files changed, start tcbuild.yml as before: workflow_dispatch reports `build` on the bump commit.
          BUMP=$(git rev-parse HEAD)
          only_version=true
          while read -r f; do
            case "$f" in
              BROTLib/BROTLib/BROTLib.plcproj|BROTLib/BROTLib/GVLs/Global_Version.TcGVL) ;;
              *) only_version=false ;;
            esac
          done < <(git diff --name-only "$PRE_BUMP" "$BUMP")

          # prints a commit with the same tree as the pre-bump head and the proof status, nothing if there is none
          find_tested() {
            local pre_tree sha n
            pre_tree=$(git rev-parse "$PRE_BUMP^{tree}")
            for sha in "$PRE_BUMP" $(gh run list --workflow tcbuild.yml --status success --limit 50 --json headSha --jq '.[].headSha' | sort -u); do
              [ "$(gh api "repos/$GH_REPO/git/commits/$sha" --jq .tree.sha)" = "$pre_tree" ] || continue
              n=$(gh api "repos/$GH_REPO/commits/$sha/statuses" --jq "[.[] | select(.context==\"$PROOF\" and .state==\"success\")] | length")
              if [ "$n" -gt 0 ]; then echo "$sha"; return 0; fi
            done
          }
          tested=""
          # best effort: an API error means no proof, and the bump commit is built as before
          if [ "$only_version" = true ]; then tested=$(find_tested || true); fi

          if [ -n "$tested" ]; then
            echo "The tree of $PRE_BUMP was built and tested on $tested: reporting build on $BUMP without a rebuild."
            for ctx in build "$PROOF"; do
              gh api "repos/$GH_REPO/statuses/$BUMP" -f state=success -f context="$ctx" \
                -f description="version bump of a tested tree, no rebuild" -f target_url="$RUN_URL"
            done
          else
            echo "No proof for the tree of $PRE_BUMP (or more than the version files changed): building the bump commit."
            gh workflow run tcbuild.yml --ref develop
          fi


      - name: Open release PR (develop -> main)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          existing=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Release v${VERSION}"
            echo "Updated existing PR #${existing}"
          else
            gh pr create --base main --head develop \
              --title "Release v${VERSION}" \
              --body "Version bump to ${VERSION}. Merging this PR tags v${VERSION} on main (tag-release.yml)."
          fi
