name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 0.3.2 (Major.Minor.Patch)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be Major.Minor.Patch (e.g. 0.3.2), got: ${{ inputs.version }}"
            exit 1
          fi

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Bump ProjectVersion and GVL_Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          PLCPROJ="BROTLib/BROTLib/BROTLib.plcproj"
          GVL="BROTLib/BROTLib/GVLs/Global_Version.TcGVL"

          sed -i "s|<ProjectVersion>.*</ProjectVersion>|<ProjectVersion>${VERSION}</ProjectVersion>|" "$PLCPROJ"

          sed -i \
            -e "s|iMajor := [0-9]*|iMajor := ${MAJOR}|" \
            -e "s|iMinor := [0-9]*|iMinor := ${MINOR}|" \
            -e "s|iBuild := [0-9]*|iBuild := ${PATCH}|" \
            -e "s|sVersion := '[0-9.]*'|sVersion := '${VERSION}'|" \
            "$GVL"

      - name: Commit and push to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BROTLib/BROTLib/BROTLib.plcproj BROTLib/BROTLib/GVLs/Global_Version.TcGVL
          git commit -m "Bump version to ${{ inputs.version }}"
          git push origin develop

      - name: Fast-forward main
        run: |
          git checkout -B main origin/main
          git merge --ff-only develop
          git push origin main

      - name: Tag release
        run: |
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
