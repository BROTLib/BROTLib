name: Release library

# Builds the tagged version with TcBuild on the shared self-hosted runner, saves it as a .library and
# attaches it to the GitHub Release for that tag (creating the release if it does not exist yet).
# tag-release.yml dispatches this after it pushes a new tag; it can also be run by hand to (re)build
# one. Keep the trigger workflow_dispatch only, never push/pull_request -- a PR from any fork would
# otherwise execute on the self-hosted runner (see tcbuild.yml).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.4.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  library:
    runs-on: [self-hosted, twincat, windows]
    # A healthy library build takes a few minutes; without a limit a hung TcXaeShell blocks the single runner.
    timeout-minutes: 30
    steps:
      - name: Validate tag
        shell: powershell
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Tag must look like v0.4.1, got '$env:TAG'" }

      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}

      # TcBuild starts TcXaeShell through COM, in the session of the runner service. A leftover one from an
      # earlier or cancelled job makes the next TcBuild fail with RPC_E_SERVERCALL_RETRYLATER (exit code 3).
      # Only this job's own session is touched: an XAE someone opened interactively is left alone.
      - name: Stop leftover TwinCAT build processes
        shell: powershell
        run: |
          $session = (Get-Process -Id $PID).SessionId
          Get-Process -Name TcXaeShell, TcBuild -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq $session } |
            ForEach-Object { Write-Host "stopping $($_.ProcessName) $($_.Id)"; Stop-Process -Id $_.Id -Force }

      - name: Get tctool
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.TCTOOL_TOKEN }}
        run: .\tools\Get-TcTool.ps1

      - name: Save library
        shell: powershell
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP "BROTLib_$($env:TAG).library"
          # tctool is pinned in .github/tctool-version and not taken from the tagged tree, so a tag from before the
          # old script existed can be re-released. Exit 1 = built with compile warnings.
          tctool BROTLib.sln library --xae BROTLib --plc BROTLib --out $file --install
          if ($LASTEXITCODE -gt 1) { throw "tctool failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $file)) { throw "tctool did not write $file" }
          "LIBRARY_FILE=$file" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Attach to GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:LIBRARY_FILE --clobber
          } else {
            gh release create $env:TAG $env:LIBRARY_FILE --verify-tag --title $env:TAG --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with exit code $LASTEXITCODE" }

      - name: Stop leftover TwinCAT build processes
        if: always()
        shell: powershell
        run: |
          $session = (Get-Process -Id $PID).SessionId
          Get-Process -Name TcXaeShell, TcBuild -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq $session } |
            ForEach-Object { Write-Host "stopping $($_.ProcessName) $($_.Id)"; Stop-Process -Id $_.Id -Force }
