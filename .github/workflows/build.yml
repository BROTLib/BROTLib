name: TwinCAT Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: {}   # allows manual triggering from the Actions tab

# The script kills any existing devenv/TcXaeShell processes at startup and
# expects exclusive control of the machine - overlapping runs would stomp on
# each other. Queue them instead of cancelling, since cancelling a run
# mid-way could leave a TcXaeShell process orphaned for the next one.
concurrency:
  group: twincat-build
  cancel-in-progress: false

jobs:
  build:
    # Adjust this label to match whatever label(s) you gave the self-hosted
    # runner when registering it (Settings > Actions > Runners).
    runs-on: [self-hosted, windows, twincat]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and check PLC project
        shell: powershell   # Windows PowerShell 5.1 - this machine has no pwsh (PowerShell 7) installed
        run: .\.github\scripts\Build.ps1
