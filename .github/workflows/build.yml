name: TwinCAT Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    # Register your self-hosted runner with these labels (or edit to match
    # whatever labels you actually used when registering it).
    runs-on: [self-hosted, Windows, TwinCAT]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build TwinCAT solution
        shell: powershell
        run: |
          .\.github\scripts\build.ps1 `
            -SolutionPath "$env:GITHUB_WORKSPACE\BROTLib.sln" `
            -Configuration "${{ vars.TWINCAT_BUILD_CONFIGURATION || 'Release' }}" `
            -Platform "${{ vars.TWINCAT_BUILD_PLATFORM || 'TwinCAT RT (x64)' }}" `
            -DteProgId "${{ vars.TWINCAT_DTE_PROGID || 'TcXaeShell.DTE.15.0' }}"
