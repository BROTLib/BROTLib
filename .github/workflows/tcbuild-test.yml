name: TcBuild test (manual)

# runs-on is a self-hosted runner on a public repo: keep this trigger workflow_dispatch only, never
# push/pull_request -- a PR from any fork would otherwise execute on it (BROTLib#31; a prior attempt
# at auto-triggering did exactly this and was reverted, see specs/design/twincat-ci-runner-setup.md)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, twincat, windows, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with TcBuild
        shell: powershell
        run: |
          & "C:\Program Files\Industrial Brains B.V\TcBuild\TcBuild.exe" build "${{ github.workspace }}\BROTLib.sln"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "TcBuild failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
